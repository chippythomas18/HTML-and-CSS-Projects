<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Effects Challenge</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="gallery-page">
    <section class="intro">
      <p class="eyebrow">CSS Effects Challenge</p>
      <h1>Hover Effects</h1>
      <p>
        Enhance typography by linking to Google Fonts in the HTML &lt;head&gt; section,
        then setting them with CSS font-family.
      </p>
    </section>

    <section class="image-gallery" aria-label="Image hover effect examples">
      <figure class="image-card rotate-effect">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="A sunlit forest path">
        <figcaption>Rotate and brighten</figcaption>
      </figure>

      <figure class="image-card scale-effect">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Blue ocean waves rolling toward shore">
        <figcaption>Scale and saturate</figcaption>
      </figure>

      <figure class="image-card color-effect">
        <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Green mountains under a cloudy sky">
        <figcaption>Color shift</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
